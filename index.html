<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tex Stop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <img src="assets/logo-texpub.png" alt="Tex Pub">
      <div>
        <div class="title">TEX STOP</div>
        <div class="subtitle">Pensou, escreveu, gritou STOP!</div>
      </div>
    </div>
    <span class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Pronto</span>
    </span>
  </div>

  <section class="hero panel join-only">
    <div>
      <h2>Entre na partida</h2>
      <p class="muted">Digite o nome da sua equipe. Depois você será levado para a tela do jogo.</p>
      <form id="joinForm" class="grid">
        <div class="field">
          <label for="teamName">Nome da equipe</label>
          <input id="teamName" maxlength="28" required placeholder="Ex.: Texugos Atômicos" autocomplete="off">
        </div>
        <button class="btn" type="submit">ENTRAR NO JOGO</button>
      </form>
    </div>
    <img class="mascot" src="assets/texuguinha.png" alt="Texuguinha jogando Stop">
  </section>
</div>

<script type="module" src="js/join.js"></script>
</body>
</html>
