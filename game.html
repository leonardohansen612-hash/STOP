<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12081f">
  <title>Tex Stop - Jogo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="game-body">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="grain"></div>

  <div class="wrap game-page">
    <div class="game-header panel glass-card">
      <div class="game-brand-mini">
        <img src="assets/logo-texpub.png" alt="Tex Pub">
        <div>
          <div class="mini-label">EQUIPE</div>
          <div id="teamDisplay" class="team-name-game">...</div>
        </div>
      </div>

      <span class="status game-status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Conectando...</span>
      </span>
    </div>

    <section id="waiting" class="panel waiting-game waiting-stage">
      <div class="waiting-glow"></div>
      <img class="waiting-mascot" src="assets/texuguinha.png" alt="Texuguinha">
      <div class="waiting-copy">
        <span class="eyebrow">TUDO PRONTO</span>
        <h2>Você está no jogo!</h2>
        <p class="muted">Aguarde o administrador iniciar a próxima rodada.</p>
        <div class="waiting-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </section>

    <section id="game" hidden>
      <div class="mobile-game-shell">
        <div class="round-top panel glass-card">
          <div class="letter-box stat-card">
            <span class="mini-label">LETRA</span>
            <strong class="round-letter" id="letter">?</strong>
          </div>

          <div class="timer-box stat-card">
            <span class="mini-label">TEMPO</span>
            <strong class="round-timer" id="timer">--:--</strong>
          </div>
        </div>

        <div class="panel category-step play-card">
          <div class="play-card-orbit" aria-hidden="true"></div>

          <div class="step-progress">
            <span id="categoryCounter">Categoria 1 de 10</span>
            <div class="progress-track">
              <div id="categoryProgress" class="progress-fill"></div>
            </div>
          </div>

          <div class="category-kicker">RESPONDA AGORA</div>
          <div class="current-category" id="categoryName">Nome</div>

          <label class="sr-only" for="categoryAnswer">Sua resposta</label>
          <div class="answer-shell">
            <span class="answer-icon">✦</span>
            <input id="categoryAnswer" class="single-answer" maxlength="45" autocomplete="off" placeholder="Digite sua resposta...">
          </div>

          <div class="step-actions">
            <button id="backBtn" class="btn secondary" type="button">← VOLTAR</button>
            <button id="nextBtn" class="btn btn-next" type="button">AVANÇAR →</button>
            <button id="stopBtn" class="stopbtn" type="button" hidden>🛑 STOP!</button>
          </div>
        </div>
      </div>
    </section>

    <section id="stopped" class="panel stopped-stage" hidden>
      <div class="stopped-icon">🛑</div>
      <span class="eyebrow">RODADA ENCERRADA</span>
      <h2>STOP!</h2>
      <p id="stopMessage" class="muted"></p>
      <p>Suas respostas foram salvas. Aguarde a correção.</p>
    </section>
  </div>

  <div class="flash" id="flash">
    <div class="flash-inner">
      <div class="huge">STOP!</div>
      <div class="who" id="flashWho"></div>
    </div>
  </div>

  <script type="module" src="js/player.js"></script>
</body>
</html>
